[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grammatike"
version = "0.2.0"
description = "A DSPy-based analyzer of Ancient Greek syntax, using an alternative scheme to Universal Dependencies designed for research and teaching."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Neel Smith", email = "nsmith@holycross.edu" },
]
dependencies = [
    "dspy>=3.0",
    "pydantic>=2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
# Needed to run `pytest` -- not a runtime dependency of the package itself,
# so a plain `pip install -e .` (or installing from GitHub) does NOT pull
# these in. Install with `pip install -e ".[test]"`.
test = [
    "pytest",
    "python-dotenv",
]
# Everything `test` needs, plus the tools DEVELOPMENT.md/USAGE.md's other
# workflows call for: `docs/build_api_docs.py` (pdoc), the `marimo/`
# notebooks, `optimize_gepa.py`/`model_bakeoff.py`'s GEPA runs, and
# rendering Graphviz DOT diagrams (marimo/greek_syntaxer_dot.py,
# analyses_to_png.py -- see notes/dot_diagrams.md). The `graphviz` package
# here is only a thin subprocess wrapper -- actually rendering a diagram
# also needs Graphviz's own `dot` command-line tool installed separately
# (e.g. `brew install graphviz` on macOS, `apt install graphviz` on Linux);
# generating DOT *text* (tokengraph_to_dot() itself, or analysis_to_dot.py)
# needs neither. Install with `pip install -e ".[dev]"`.
dev = [
    "pytest",
    "python-dotenv",
    "pdoc",
    "marimo",
    "graphviz",
]

[project.urls]
Homepage = "https://github.com/neelsmith/grammatike"
Repository = "https://github.com/neelsmith/grammatike"
Issues = "https://github.com/neelsmith/grammatike/issues"

[tool.setuptools.packages.find]
include = ["grammatike*"]
