[pytest]
# Makes "import grammatike" and "from fixtures.gold_examples import ..."
# work when running plain `pytest` from the repo root, without needing an
# installed package or a root-level conftest.py trick.
pythonpath = .

markers =
    live: exercises the real configured LM instead of DummyLM (skipped by default; run with -m live)

# Offline/DummyLM tests run by default; opt into live-model tests with
# `pytest -m live`.
addopts = -m "not live"

# _to_delete/ holds files retired from the package (e.g. the old LM-driven
# segmentation_dspy.py and its own live test) that an earlier cleanup
# couldn't actually delete from this checkout (no delete permission on
# this connected folder) and moved aside instead, pending manual removal.
# Left in place, its own test module fails to import (it references
# modules/fixtures that no longer exist), so it's excluded from collection
# here rather than relying on every contributor to remember
# `--ignore=_to_delete` by hand. Safe to delete this whole directory (and
# then this line) by hand once that's possible.
norecursedirs = _to_delete .git .venv
